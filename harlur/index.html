<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Takeaway · Aricee - The Indian Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../menu-extras.js"></script>
<style>
  :root {
    --accent: #FC8019;
    --accent-dark: #E0690A;
    --accent-soft: #FFF3E8;
    --bg: #F4F4F5;
    --surface: #FFFFFF;
    --line: #E9E9EB;
    --text: #1C1C1C;
    --text-soft: #686B78;
    --good: #1BA672;
    --bad: #D9363E;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  #app { max-width: 640px; margin: 0 auto; background: var(--surface); min-height: 100vh; position: relative; }

  /* header */
  .hero { padding: 18px 16px 12px; }
  .hero h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
  .hero .sub { font-size: 13px; color: var(--text-soft); }
  .hours { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .hours.open { background: #E6F6EF; color: var(--good); }
  .hours.closed { background: #FDEBEC; color: var(--bad); }
  .hours .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .closed-banner { margin: 0 16px 10px; padding: 12px 14px; background: #FDEBEC; color: var(--bad); border-radius: 12px; font-size: 13.5px; font-weight: 600; }
  .offer { margin: 0 16px 10px; padding: 11px 14px; background: linear-gradient(90deg, #FFF3E8, #FFE3CC); border: 1px dashed var(--accent); border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--accent-dark); }
  .searchwrap { padding: 0 16px 10px; }
  .search { width: 100%; border: 1px solid var(--line); background: #F7F7F8; border-radius: 12px; padding: 11px 14px; font-size: 14.5px; font-family: inherit; outline: none; }
  .search:focus { border-color: var(--accent); background: #fff; }

  /* sticky category chips */
  .chips { position: sticky; top: 0; z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* menu */
  .cat { padding: 6px 16px 4px; scroll-margin-top: 58px; }
  .cat h2 { font-size: 17px; font-weight: 800; margin: 18px 0 4px; }
  .item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .item:last-child { border-bottom: none; }
  .item .info { flex: 1; min-width: 0; }
  .veg { display: inline-block; width: 16px; height: 16px; border: 1.5px solid; border-radius: 3px; position: relative; vertical-align: middle; margin-bottom: 4px; }
  .veg::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: currentColor; }
  .veg.v { color: #0F8A3C; } .veg.n { color: #B4281F; } .veg.e { color: #E0A30B; }
  .item .name { font-size: 15.5px; font-weight: 700; line-height: 1.3; margin: 0 0 3px; }
  .item .price { font-size: 14.5px; font-weight: 600; }
  .item .price s { color: var(--text-soft); font-weight: 500; margin-right: 6px; }
  .item .price .off { color: var(--good); font-size: 12px; font-weight: 700; margin-left: 6px; }
  .item .desc { font-size: 12.5px; color: var(--text-soft); line-height: 1.45; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .custom { font-size: 11.5px; color: var(--text-soft); margin-top: 6px; }
  .media { flex: none; width: 124px; position: relative; padding-bottom: 14px; }
  .media .photo { width: 124px; height: 112px; border-radius: 14px; object-fit: cover; background: #EEE; display: block; }
  .media .nophoto { width: 124px; height: 12px; }
  .addbtn { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 98px; height: 36px; background: #fff; border: 1px solid #D4D5D9; color: var(--good); font-weight: 800; font-size: 14px; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,.14); display: flex; align-items: center; justify-content: center; gap: 4px; letter-spacing: .02em; }
  .addbtn.dis { color: #A0A3AD; box-shadow: none; }
  .addbtn small { font-size: 10px; font-weight: 700; }
  .stepper { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 98px; height: 36px; background: #fff; border: 1px solid #D4D5D9; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,.14); display: flex; align-items: center; justify-content: space-between; color: var(--good); font-weight: 800; }
  .stepper button { border: none; background: none; color: inherit; font-size: 19px; font-weight: 700; width: 32px; height: 34px; }
  .stepper span { font-size: 14px; }
  .noresult { padding: 40px 20px; text-align: center; color: var(--text-soft); }

  /* bottom cart bar */
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 640px; margin: 0 auto; padding: 10px 14px calc(10px + var(--safe-bottom)); background: linear-gradient(to top, rgba(255,255,255,.98) 70%, rgba(255,255,255,0)); }
  .cartbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--good); color: #fff; border: none; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 22px rgba(27,166,114,.35); }
  .cartbtn small { display: block; font-size: 11.5px; font-weight: 600; opacity: .85; margin-top: 2px; }
  .spacer { height: 110px; }

  /* sheets */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet-head { padding: 16px 18px 10px; display: flex; gap: 12px; align-items: flex-start; }
  .sheet-head h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3; }
  .sheet-head .x { margin-left: auto; border: none; background: #F0F0F2; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; flex: none; }
  .sheet-img { width: 100%; height: 190px; object-fit: cover; background: #EEE; }
  .sheet-body { overflow-y: auto; padding: 0 18px 12px; flex: 1; }
  .sheet-desc { font-size: 13px; color: var(--text-soft); line-height: 1.5; margin: 0 0 14px; }
  .group { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .group h4 { margin: 0 0 2px; font-size: 15px; font-weight: 800; }
  .group .hint { font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
  .group .hint b { color: var(--bad); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #F0F0F2; font-size: 14.5px; font-weight: 500; cursor: pointer; }
  .opt:first-of-type { border-top: none; }
  .opt .p { margin-left: auto; font-size: 13.5px; font-weight: 600; color: var(--text-soft); }
  .opt input { width: 19px; height: 19px; accent-color: var(--good); flex: none; }
  .sheet-foot { padding: 12px 18px calc(14px + var(--safe-bottom)); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; background: #fff; }
  .qty { display: flex; align-items: center; border: 1px solid #D4D5D9; border-radius: 12px; height: 48px; flex: none; }
  .qty button { border: none; background: none; width: 38px; font-size: 20px; font-weight: 700; color: var(--good); height: 46px; }
  .qty span { min-width: 20px; text-align: center; font-weight: 800; }
  .primary { flex: 1; height: 48px; border: none; border-radius: 12px; background: var(--good); color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .primary:disabled { background: #BDBFC7; }
  .errmsg { color: var(--bad); font-size: 12.5px; font-weight: 600; padding: 0 18px 6px; }

  /* cart sheet */
  .cl { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .cl .n { flex: 1; font-size: 14.5px; font-weight: 700; }
  .cl .m { font-size: 12px; color: var(--text-soft); margin-top: 3px; line-height: 1.45; }
  .cl .tp { font-weight: 700; font-size: 14px; min-width: 64px; text-align: right; }
  .mini { display: flex; align-items: center; border: 1px solid #D4D5D9; border-radius: 9px; height: 32px; margin-top: 8px; width: 88px; justify-content: space-between; color: var(--good); }
  .mini button { border: none; background: none; width: 28px; height: 30px; font-size: 17px; font-weight: 700; color: inherit; }
  .mini span { font-weight: 800; font-size: 13.5px; }
  .bill { padding: 14px 0 4px; }
  .bill .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .bill .row.t { font-weight: 800; font-size: 16px; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }

  /* confirmation */
  .confirm { padding: 50px 22px 30px; text-align: center; }
  .confirm .tick { width: 64px; height: 64px; border-radius: 50%; background: #E6F6EF; color: var(--good); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 14px; }
  .confirm h2 { margin: 0 0 4px; font-size: 21px; }
  .confirm .ordno { font-size: 38px; font-weight: 800; color: var(--accent-dark); margin: 6px 0 10px; }
  .status { display: inline-flex; align-items: center; gap: 8px; background: #F4F4F5; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--text-soft); }
  .status.accepted { background: #E6F6EF; color: var(--good); }
  .status.cancelled { background: #FDEBEC; color: var(--bad); }
  .summary { text-align: left; margin: 22px auto 0; max-width: 420px; border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; }
  .summary .cl:last-child { border-bottom: none; }
  .secondary { margin-top: 22px; background: #F0F0F2; border: none; border-radius: 12px; padding: 13px 20px; font-weight: 700; font-size: 14px; }
  .loading { padding: 70px 20px; text-align: center; color: var(--text-soft); }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading menu…</div></div>
<div id="overlay-root"></div>

<script>
const SUPABASE_URL = 'https://dgaurjpzgwyhwilhjowq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYXVyanB6Z3d5aHdpbGhqb3dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NjI1NDYsImV4cCI6MjA5NzQzODU0Nn0.yp7uZXj4-tYTAeuVkvn5sUw7IOv_CZcfkXYHf40rh6E';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const OUTLET = 'Harlur';            // order brand ('Aricee' or 'Harlur')
const OUTLET_NAME = 'Aricee - The Indian Kitchen';
const OUTLET_PLACE = 'Harlur';
const PRICE_ADD = 10;        // Harlur charges Rs 10 more per item
const X = window.MENU_EXTRAS || { hours: { open: 11, close: 23 }, groups: {}, itemGroups: {}, info: {}, newItems: [] };

/* ---------- opening hours (India time) & happy hour ---------- */
function istNow() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' })); }
function isOpen() { const h = istNow().getHours(); return h >= X.hours.open && h < X.hours.close; }
function fmtHour(h) { const s = h >= 12 ? 'PM' : 'AM'; return ((h + 11) % 12 + 1) + ' ' + s; }
const HH_CATEGORIES = ['Lite Bites', 'Indus Wraps'];
const HH_TAG = ' (Happy Hour -50%)';
function happyHourOn() { const h = istNow().getHours(); return h >= 16 && h < 19; }
function unitBase(item) {
  return (happyHourOn() && HH_CATEGORIES.includes(item.category)) ? Math.round(item.price * 50) / 100 : item.price;
}

/* ---------- state ---------- */
const state = { menu: [], cart: [], query: '', sheet: null, placedOrder: null, placing: false, activeCat: null };
const rupee = n => 'Rs.' + (Math.round(n * 100) / 100).toString().replace(/\.(\d)$/, '.$10');
function money(n) { return '₹' + (Math.round(n * 100) / 100).toString(); }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const $ = id => document.getElementById(id);

async function loadMenu() {
  const { data, error } = await supa.from('menu_items').select('*').order('sort_order', { ascending: true });
  if (error) { $('app').innerHTML = '<div class="loading">Could not load the menu. Please try again in a moment.</div>'; return; }
  let rows = (data || []).filter(m => Number(m.price) > 0 && (m.brand || 'Aricee') === 'Aricee')
    .map(m => ({ id: m.id, category: m.category, name: m.name, price: Number(m.price) + PRICE_ADD }));
  const have = new Set(rows.map(r => r.id));
  // new items that are not in the server menu yet (go live with the next menu update)
  (X.newItems || []).forEach(n => { if (!have.has(n.id)) rows.push({ id: n.id, category: n.category, name: n.name, price: Number(n.price) + PRICE_ADD }); });
  state.menu = rows;
  render();
}

/* ---------- customization ---------- */
function groupsFor(item) { return (X.itemGroups[item.id] || []).map(k => ({ key: k, ...X.groups[k] })).filter(g => g.options); }
function defaultSel(item) {
  const sel = {};
  groupsFor(item).forEach(g => { sel[g.key] = g.default ? [g.default] : []; });
  return sel;
}
function selectedMods(item, sel) {
  const out = [];
  groupsFor(item).forEach(g => (sel[g.key] || []).forEach(id => {
    const o = g.options.find(o => o.id === id);
    if (o) out.push({ g: g.title.replace(/^Choose your /, '').replace(/^./, c => c.toUpperCase()), n: o.name, p: Number(o.price) || 0, id });
  }));
  return out;
}
function modsLabel(mods) { return mods.map(m => m.n + (m.p ? ' (+' + money(m.p) + ')' : '')).join(', '); }
function missingGroup(item, sel) {
  return groupsFor(item).find(g => g.required && (sel[g.key] || []).length === 0);
}

/* ---------- cart ---------- */
function lineKey(item, mods) { return item.id + '|' + mods.map(m => m.id).sort().join(','); }
function addLine(item, mods, qty) {
  const key = lineKey(item, mods);
  const unit = unitBase(item) + mods.reduce((s, m) => s + m.p, 0);
  const ex = state.cart.find(c => c.key === key);
  if (ex) { ex.qty += qty; ex.price = unit; }
  else state.cart.push({ key, itemId: item.id, name: item.name, price: unit, mods, qty, happyHour: unitBase(item) < item.price });
}
function changeLine(key, d) {
  const l = state.cart.find(c => c.key === key); if (!l) return;
  l.qty += d; if (l.qty <= 0) state.cart = state.cart.filter(c => c.key !== key);
  render(); if (state.sheet && state.sheet.type === 'cart') openCart();
}
function itemQty(itemId) { return state.cart.filter(c => c.itemId === itemId).reduce((s, c) => s + c.qty, 0); }
function cartTotal() { return state.cart.reduce((s, c) => s + c.price * c.qty, 0); }
function cartCount() { return state.cart.reduce((s, c) => s + c.qty, 0); }

function onAdd(itemId) {
  if (!isOpen()) return;
  const item = state.menu.find(m => m.id === itemId); if (!item) return;
  if (groupsFor(item).length === 0) { addLine(item, [], 1); render(); return; }
  openItemSheet(item);
}
function onMinus(itemId) {
  const lines = state.cart.filter(c => c.itemId === itemId);
  if (lines.length === 0) return;
  if (lines.length > 1) { openCart(); return; }   // several customised versions: adjust in the cart
  changeLine(lines[0].key, -1);
}
function onPlus(itemId) {
  const item = state.menu.find(m => m.id === itemId); if (!item) return;
  const lines = state.cart.filter(c => c.itemId === itemId);
  if (groupsFor(item).length === 0) { if (isOpen()) { addLine(item, [], 1); render(); } return; }
  openItemSheet(item);   // choose options for another one
}

/* ---------- item sheet ---------- */
function closeSheet() { state.sheet = null; $('overlay-root').innerHTML = ''; document.body.style.overflow = ''; }
function openItemSheet(item) {
  state.sheet = { type: 'item', item, sel: defaultSel(item), qty: 1, error: '' };
  drawItemSheet(); document.body.style.overflow = 'hidden';
}
function sheetUnit() {
  const { item, sel } = state.sheet;
  return unitBase(item) + selectedMods(item, sel).reduce((s, m) => s + m.p, 0);
}
function drawItemSheet() {
  const s = state.sheet, item = s.item, info = X.info[item.id] || {};
  const groups = groupsFor(item);
  const hh = unitBase(item) < item.price;
  $('overlay-root').innerHTML = `
    <div class="overlay" id="ov"><div class="sheet">
      ${info.i ? `<img class="sheet-img" src="${esc(info.i)}" referrerpolicy="no-referrer" onerror="this.remove()" alt="">` : ''}
      <div class="sheet-head"><div><span class="veg ${vegCls(info.f)}"></span><h3>${esc(item.name)}</h3></div><button class="x" id="sx">✕</button></div>
      <div class="sheet-body">
        ${info.d ? `<p class="sheet-desc">${esc(info.d)}</p>` : ''}
        ${groups.map(g => `
          <div class="group" data-g="${g.key}">
            <h4>${esc(g.title)}</h4>
            <div class="hint">${g.required ? '<b>Required</b> · ' : 'Optional · '}${g.type === 'multi' ? 'Select any' : 'Select 1'}</div>
            ${g.options.map(o => `
              <label class="opt">
                <input type="${g.type === 'multi' ? 'checkbox' : 'radio'}" name="g-${g.key}" value="${esc(o.id)}" ${(s.sel[g.key] || []).includes(o.id) ? 'checked' : ''}>
                <span>${esc(o.name)}</span><span class="p">${o.price ? '+' + money(o.price) : ''}</span>
              </label>`).join('')}
          </div>`).join('')}
      </div>
      ${s.error ? `<div class="errmsg">${esc(s.error)}</div>` : ''}
      <div class="sheet-foot">
        <div class="qty"><button id="qm">−</button><span>${s.qty}</span><button id="qp">+</button></div>
        <button class="primary" id="sadd"><span>Add item</span><span>${money(sheetUnit() * s.qty)}</span></button>
      </div>
    </div></div>`;
  $('ov').onclick = e => { if (e.target.id === 'ov') closeSheet(); };
  $('sx').onclick = closeSheet;
  $('qm').onclick = () => { if (s.qty > 1) { s.qty--; keepScroll(drawItemSheet); } };
  $('qp').onclick = () => { s.qty++; keepScroll(drawItemSheet); };
  document.querySelectorAll('.group input').forEach(inp => inp.onchange = () => {
    const key = inp.closest('.group').dataset.g, g = X.groups[key];
    if (g.type === 'multi') {
      const cur = new Set(s.sel[key] || []);
      inp.checked ? cur.add(inp.value) : cur.delete(inp.value); s.sel[key] = [...cur];
    } else s.sel[key] = [inp.value];
    s.error = ''; keepScroll(drawItemSheet);
  });
  $('sadd').onclick = () => {
    const miss = missingGroup(item, s.sel);
    if (miss) { s.error = 'Please choose: ' + miss.title.replace(/^Choose your /, ''); keepScroll(drawItemSheet); return; }
    addLine(item, selectedMods(item, s.sel), s.qty);
    closeSheet(); render();
  };
}
function keepScroll(fn) {
  const b = document.querySelector('.sheet-body'); const t = b ? b.scrollTop : 0;
  fn(); const nb = document.querySelector('.sheet-body'); if (nb) nb.scrollTop = t;
}
function vegCls(f) { return f === 'Veg' ? 'v' : f === 'Egg' ? 'e' : f ? 'n' : 'v'; }

/* ---------- cart sheet ---------- */
function openCart() {
  state.sheet = { type: 'cart' };
  const total = cartTotal();
  $('overlay-root').innerHTML = `
    <div class="overlay" id="ov"><div class="sheet">
      <div class="sheet-head"><h3>Your order</h3><button class="x" id="sx">✕</button></div>
      <div class="sheet-body">
        ${state.cart.length === 0 ? '<div class="noresult">Your cart is empty.</div>' : state.cart.map(c => `
          <div class="cl">
            <div style="flex:1">
              <div class="n">${esc(c.name)}${c.happyHour ? ' <span style="color:var(--good);font-size:12px;">(Happy Hour -50%)</span>' : ''}</div>
              ${c.mods.length ? `<div class="m">${esc(modsLabel(c.mods))}</div>` : ''}
              <div class="mini"><button data-m="${esc(c.key)}">−</button><span>${c.qty}</span><button data-p="${esc(c.key)}">+</button></div>
            </div>
            <div class="tp">${money(c.price * c.qty)}</div>
          </div>`).join('')}
        <div class="bill"><div class="row t"><span>To pay</span><span>${money(total)}</span></div></div>
        <p style="font-size:12px;color:var(--text-soft);margin:6px 0 0;">Takeaway · pay at the counter when you collect.</p>
      </div>
      <div class="sheet-foot">
        <button class="primary" id="place" ${state.cart.length === 0 || state.placing || !isOpen() ? 'disabled' : ''}>
          <span>${!isOpen() ? 'Closed right now' : state.placing ? 'Placing order…' : 'Place order'}</span><span>${money(total)}</span></button>
      </div>
    </div></div>`;
  document.body.style.overflow = 'hidden';
  $('ov').onclick = e => { if (e.target.id === 'ov') closeSheet(); };
  $('sx').onclick = closeSheet;
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => changeLine(b.dataset.m, -1));
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => changeLine(b.dataset.p, 1));
  if ($('place')) $('place').onclick = placeOrder;
  if (state.cart.length === 0) { closeSheet(); render(); }
}

/* ---------- placing the order ---------- */
async function placeOrder() {
  if (state.cart.length === 0 || state.placing) return;
  if (!isOpen()) { alert('We are closed right now. Orders open at ' + fmtHour(X.hours.open) + '.'); return; }
  state.placing = true; openCart();
  const subtotal = cartTotal();
  const { data, error } = await supa.rpc('place_order', {
    p_brand: OUTLET,
    p_items: state.cart.map(c => ({
      name: c.name + (c.happyHour ? HH_TAG : ''), price: c.price, qty: c.qty,
      mods: c.mods.map(m => m.g + ': ' + m.n + (m.p ? ' (+' + m.p + ')' : ''))
    })),
    p_subtotal: subtotal, p_discount_amt: 0, p_total: subtotal
  });
  state.placing = false;
  if (error || !data || !data[0]) { alert('Could not place your order — please try again.'); openCart(); return; }
  state.placedOrder = { id: data[0].id, order_no: data[0].order_no, status: 'pending', lines: state.cart.slice(), total: subtotal };
  state.cart = []; closeSheet(); render(); window.scrollTo(0, 0);
  pollOrderStatus(data[0].id);
}
function pollOrderStatus(orderId) {
  const iv = setInterval(async () => {
    if (!state.placedOrder || state.placedOrder.id !== orderId) { clearInterval(iv); return; }
    const { data, error } = await supa.rpc('get_order_status', { p_id: orderId });
    if (!error && data && data !== state.placedOrder.status) { state.placedOrder = { ...state.placedOrder, status: data }; render(); }
  }, 4000);
}
function statusLabel(s) {
  if (s === 'cancelled') return { text: 'Order cancelled — please check with the counter', cls: 'cancelled' };
  if (s === 'accepted') return { text: 'Order accepted — being prepared', cls: 'accepted' };
  if (s === 'billed') return { text: 'Ready — please collect', cls: 'accepted' };
  return { text: 'Order received — waiting for confirmation', cls: '' };
}

/* ---------- main render ---------- */
function render() {
  const app = $('app');
  if (state.placedOrder) {
    const st = statusLabel(state.placedOrder.status);
    app.innerHTML = `
      <div class="confirm">
        <div class="tick">✓</div><h2>Order placed!</h2>
        <div class="ordno">#${state.placedOrder.order_no}</div>
        <div class="status ${st.cls}">${st.text}</div>
        <div class="summary">
          ${state.placedOrder.lines.map(c => `<div class="cl"><div style="flex:1"><div class="n">${c.qty} × ${esc(c.name)}</div>${c.mods.length ? `<div class="m">${esc(modsLabel(c.mods))}</div>` : ''}</div><div class="tp">${money(c.price * c.qty)}</div></div>`).join('')}
          <div class="bill"><div class="row t"><span>Total</span><span>${money(state.placedOrder.total)}</span></div></div>
        </div>
        <button class="secondary" id="again">Order something else</button>
      </div>`;
    $('again').onclick = () => { state.placedOrder = null; render(); };
    return;
  }
  const open = isOpen();
  const q = state.query.trim().toLowerCase();
  const items = state.menu.filter(m => !q || m.name.toLowerCase().includes(q) || ((X.info[m.id] || {}).d || '').toLowerCase().includes(q));
  const cats = [...new Set(items.map(m => m.category))];
  const count = cartCount();

  const prevSearch = document.activeElement && document.activeElement.id === 'search';
  app.innerHTML = `
    <div class="hero">
      <h1>${esc(OUTLET_NAME)}</h1>
      <div class="sub">${esc(OUTLET_PLACE)} · Takeaway</div>
      <span class="hours ${open ? 'open' : 'closed'}"><span class="dot"></span>${open ? 'Open now · ' + fmtHour(X.hours.open) + ' – ' + fmtHour(X.hours.close) : 'Closed · opens at ' + fmtHour(X.hours.open)}</span>
    </div>
    ${open ? '' : `<div class="closed-banner">We are closed right now. You can look at the menu, and ordering opens daily from ${fmtHour(X.hours.open)} to ${fmtHour(X.hours.close)}.</div>`}
    ${open && happyHourOn() ? '<div class="offer">🔥 Happy Hour: 50% off Lite Bites &amp; Wraps until 7 PM</div>' : ''}
    <div class="searchwrap"><input class="search" id="search" placeholder="Search for dishes" value="${esc(state.query)}"></div>
    <div class="chips" id="chips">${cats.map(c => `<button class="chip ${state.activeCat === c ? 'active' : ''}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div id="menu">
      ${cats.length === 0 ? '<div class="noresult">No dishes found.</div>' : cats.map(cat => `
        <section class="cat" id="cat-${esc(cat).replace(/\s+/g, '_')}" data-cat="${esc(cat)}">
          <h2>${esc(cat)}</h2>
          ${items.filter(m => m.category === cat).map(item => itemRow(item, open)).join('')}
        </section>`).join('')}
    </div>
    <div class="spacer"></div>
    ${count > 0 ? `<div class="cartbar"><button class="cartbtn" id="viewcart"><span>${count} item${count > 1 ? 's' : ''}<small>${money(cartTotal())}</small></span><span>View cart ›</span></button></div>` : ''}
  `;
  const s = $('search');
  s.oninput = () => { state.query = s.value; const pos = s.selectionStart; render(); const n = $('search'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const el = document.querySelector(`[data-cat="${CSS.escape(b.dataset.chip)}"]`);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 56, behavior: 'smooth' });
  });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => onAdd(b.dataset.add));
  document.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => onPlus(b.dataset.plus));
  document.querySelectorAll('[data-minus]').forEach(b => b.onclick = () => onMinus(b.dataset.minus));
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { const it = state.menu.find(m => m.id === b.dataset.open); if (it && isOpen() && groupsFor(it).length) openItemSheet(it); });
  if ($('viewcart')) $('viewcart').onclick = openCart;
  if (prevSearch) $('search').focus();
}
function itemRow(item, open) {
  const info = X.info[item.id] || {};
  const base = unitBase(item), hh = base < item.price;
  const qty = itemQty(item.id), custom = groupsFor(item).length > 0;
  const control = !open ? `<button class="addbtn dis" disabled>CLOSED</button>`
    : qty > 0 ? `<div class="stepper"><button data-minus="${item.id}">−</button><span>${qty}</span><button data-plus="${item.id}">+</button></div>`
    : `<button class="addbtn" data-add="${item.id}">ADD${custom ? '<small>+</small>' : ''}</button>`;
  return `
    <div class="item">
      <div class="info" ${custom ? `data-open="${item.id}"` : ''}>
        <span class="veg ${vegCls(info.f)}"></span>
        <div class="name">${esc(item.name)}</div>
        <div class="price">${hh ? `<s>${money(item.price)}</s>${money(base)}<span class="off">50% OFF</span>` : money(item.price)}</div>
        ${info.d ? `<div class="desc">${esc(info.d)}</div>` : ''}
        ${custom ? '<div class="custom">Customisable</div>' : ''}
      </div>
      <div class="media">
        ${info.i ? `<img class="photo" loading="lazy" referrerpolicy="no-referrer" src="${esc(info.i)}" onerror="this.outerHTML='<div class=nophoto></div>'" alt="">` : '<div class="nophoto"></div>'}
        ${control}
      </div>
    </div>`;
}

// highlight the category chip for the section on screen
window.addEventListener('scroll', () => {
  const secs = document.querySelectorAll('.cat'); let cur = null;
  secs.forEach(s => { if (s.getBoundingClientRect().top < 120) cur = s.dataset.cat; });
  if (cur !== state.activeCat) {
    state.activeCat = cur;
    document.querySelectorAll('.chip').forEach(c => {
      const on = c.dataset.chip === cur; c.classList.toggle('active', on);
      if (on) c.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}, { passive: true });
// open/closed status and happy hour change with the clock
setInterval(() => { if (!state.sheet && !state.placedOrder && document.activeElement !== $('search')) render(); }, 60000);

loadMenu();
</script>
</body>
</html>
