<style>
  :root {
    --orange: #C1521B;
    --orange-dark: #9A3F14;
    --brown: #3B2415;
    --brown-soft: #6B4A34;
    --bg: #FBF7F1;
    --surface: #FFFFFF;
    --surface-2: #F3EAE0;
    --line: #E5D9C9;
    --text: #2A1B10;
    --text-soft: #7A6553;
    --danger: #B23A2E;
    --good: #3E7A4C;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17110C;
      --surface: #221A12;
      --surface-2: #2C2117;
      --line: #3C2E20;
      --text: #F3E9DD;
      --text-soft: #B39C87;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17110C;
    --surface: #221A12;
    --surface-2: #2C2117;
    --line: #3C2E20;
    --text: #F3E9DD;
    --text-soft: #B39C87;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: var(--safe-top); }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    position: sticky;
    top: var(--safe-top);
    z-index: 20;
    background: var(--brown);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  header.topbar .brandpick {
    display: flex;
    background: rgba(255,255,255,.12);
    border-radius: 999px;
    padding: 3px;
  }
  header.topbar .brandpick button {
    border: none;
    background: transparent;
    color: rgba(255,255,255,.75);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  header.topbar .brandpick button.active {
    background: var(--orange);
    color: #fff;
  }
  header.topbar .ordno {
    font-size: 11.5px;
    color: rgba(255,255,255,.65);
    white-space: nowrap;
  }

  main {
    flex: 1;
    padding: 14px 14px 130px;
  }

  h1.pagetitle {
    font-size: 20px;
    font-weight: 800;
    margin: 4px 0 14px;
    letter-spacing: -0.01em;
  }

  .category {
    margin-bottom: 20px;
  }
  .category h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--orange-dark);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 0 0 8px 2px;
  }
  .item-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .item-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    position: relative;
    transition: transform .08s ease;
  }
  .item-card:active { transform: scale(0.97); }
  .item-card .name {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.25;
    display: block;
    margin-bottom: 6px;
  }
  .price-strike { text-decoration: line-through; opacity: .6; font-weight: 500; }
  .hh-tag {
    position: absolute; top: -6px; left: -6px; background: var(--orange); color: #fff;
    font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 999px;
  }
  .hh-banner {
    background: var(--orange); color: #fff; text-align: center; font-weight: 700; font-size: 13.5px;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
  }
  .item-card .price {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
  }
  .item-card .qtybadge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--orange);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    min-width: 22px;
    height: 22px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }
  .item-card.zero-price { opacity: .55; }
  .item-card .warn {
    font-size: 10.5px;
    color: var(--danger);
    font-weight: 600;
    display: block;
    margin-top: 2px;
  }

  .empty-state {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 28px 18px;
    text-align: center;
    color: var(--text-soft);
    font-size: 14px;
  }
  .empty-state button {
    margin-top: 12px;
  }

  /* Cart drawer */
  .cartbar {
    position: fixed;
    left: 0; right: 0;
    bottom: var(--safe-bottom);
    max-width: 560px;
    margin: 0 auto;
    z-index: 30;
  }
  .cartbar-inner {
    background: var(--brown);
    color: #fff;
    margin: 0 12px 12px;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .cart-summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
  }
  .cart-summary-row .left {
    font-size: 13.5px;
    font-weight: 600;
    color: rgba(255,255,255,.85);
  }
  .cart-summary-row .right {
    font-size: 17px;
    font-weight: 800;
  }
  .cart-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height .2s ease;
    background: rgba(0,0,0,.15);
  }
  .cart-detail.open { max-height: 420px; overflow-y: auto; }
  .cart-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .cart-line .cname {
    flex: 1;
    font-size: 13.5px;
    font-weight: 600;
  }
  .cart-line .cprice {
    font-size: 12.5px;
    color: rgba(255,255,255,.6);
  }
  .qtystep {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qtystep button {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }
  .qtystep span { min-width: 16px; text-align: center; font-weight: 700; font-size: 13.5px; }
  .cart-actions {
    display: flex;
    gap: 8px;
    padding: 12px 14px 14px;
  }
  .btn {
    font-family: inherit;
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
  }
  .btn-kot { background: rgba(255,255,255,.12); color: #fff; }
  .btn-bill { background: var(--orange); color: #fff; }
  .btn-clear { background: transparent; color: rgba(255,255,255,.55); flex: 0 0 auto; padding: 12px; }

  /* Bottom nav */
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: var(--safe-bottom);
    z-index: 25;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    font-family: inherit;
    padding: 10px 4px 8px;
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  nav.tabbar button .ic { display: block; font-size: 18px; margin-bottom: 2px; }
  nav.tabbar button.active { color: var(--orange); }

  /* Forms */
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--orange-dark);
    margin: 0 0 10px;
  }

  .menu-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .menu-item-row:last-child { border-bottom: none; }
  .menu-item-row .mname { flex: 1; font-size: 14px; font-weight: 600; }
  .menu-item-row .mprice { width: 84px; }
  .menu-item-row .mprice input { padding: 8px 9px; font-size: 13.5px; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-soft);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .icon-btn.danger { color: var(--danger); }

  .btn-primary {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-soft);
  }
  .status-pill.connected { color: var(--good); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .order-hist-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .order-hist-item .oh-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .order-hist-item .oh-meta {
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 8px;
  }
  .order-hist-item .oh-items {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 18px);
    transform: translateX(-50%);
    background: var(--brown);
    color: #fff;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    z-index: 60;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
    max-width: 85%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  .helptext {
    font-size: 12.5px;
    color: var(--text-soft);
    line-height: 1.5;
    margin: 0 0 12px;
  }
  a.link { color: var(--orange-dark); font-weight: 600; }
</style>
</head>

const MENU_VERSION = 3; // bump this whenever a fresh menu is pushed, so devices pick it up

function loadMenu() {
  const storedVersion = DB.load('billing_menu_version', 0);
  if (storedVersion < MENU_VERSION) return DEFAULT_MENU;
  return DB.load('billing_menu', DEFAULT_MENU);
}

/* ---------- happy hour: 50% off Lite Bites & Wraps, 4pm-7pm, pickup only ---------- */
const HAPPY_HOUR_CATEGORIES = ['Lite Bites', 'Indus Wraps'];
const HAPPY_HOUR_START = 16, HAPPY_HOUR_END = 19, HAPPY_HOUR_DISCOUNT = 0.5;
function isHappyHourActive() {
  const h = new Date().getHours();
  return h >= HAPPY_HOUR_START && h < HAPPY_HOUR_END;
}
function isHappyHourCategory(cat) { return HAPPY_HOUR_CATEGORIES.includes(cat); }
function effectivePrice(item) {
  if (isHappyHourActive() && isHappyHourCategory(item.category)) {
    return Math.round(item.price * (1 - HAPPY_HOUR_DISCOUNT) * 100) / 100;
  }
  return item.price;
}

  tab: 'order',
  brand: DB.load('billing_brand', 'Aricee'),
  menu: loadMenu(),
  settings: DB.load('billing_settings', {
    aricee_name: 'Aricee - The Indian Kitchen',
    chilane_name: 'Chi Lane Kitchen',
    gstin: '',
    gstEnabled: false,

    bleDeviceName: ''

function persist() {
  DB.save('billing_brand', state.brand);
  DB.save('billing_menu', state.menu);
  DB.save('billing_menu_version', MENU_VERSION);
  DB.save('billing_settings', state.settings);
  DB.save('billing_cart', state.cart);
  DB.save('billing_discount', state.discount);
  DB.save('billing_orders', state.orders);
  DB.save('billing_counter', state.counter);
  DB.save('billing_current_order_no', state.currentOrderNo);
}

function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function nextOrderNo() {
  const t = todayStr();
  if (state.counter.date !== t) { state.counter = { date: t, n: 0 }; }
  state.counter.n += 1;
  persist();
  return state.counter.n;
}

/* ---------- cart ops ---------- */
function addToCart(item) {
  const existing = state.cart.find(c => c.itemId === item.id);
  if (existing) existing.qty += 1;
  else {
    const price = effectivePrice(item);
    state.cart.push({ itemId: item.id, name: item.name, price, originalPrice: item.price, happyHour: price < item.price, qty: 1 });
  }
  persist();
  render();
}
function changeQty(itemId, delta) {
  const line = state.cart.find(c => c.itemId === itemId);
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) state.cart = state.cart.filter(c => c.itemId !== itemId);
  persist();
  render();
}
function clearCart() {
  state.cart = [];
  state.currentOrderNo = null;
  state.currentSupabaseOrderId = null;
  state.discount = { type: 'flat', value: 0 };
  persist();
  render();
}
function setDiscount(type, value, excludeHappyHour) {
  state.discount = { type, value: Math.max(0, parseFloat(value) || 0), excludeHappyHour: !!excludeHappyHour };
  persist();
  render();
}
function cartTotals() {
  const subtotal = state.cart.reduce((s,c) => s + c.price * c.qty, 0);
  // Student discount (excludeHappyHour) skips items already on the 50% happy-hour price
  const eligible = state.discount.excludeHappyHour
    ? state.cart.filter(c => !c.happyHour).reduce((s,c) => s + c.price * c.qty, 0)
    : subtotal;
  let discountAmt = state.discount.type === 'percent'
    ? eligible * (state.discount.value / 100)
    : state.discount.value;
  discountAmt = Math.min(Math.max(discountAmt, 0), subtotal);
  const taxable = subtotal - discountAmt;
  const gstOn = !!state.settings.gstEnabled;
  const cgstAmt = gstOn ? taxable * (state.settings.cgst/100) : 0;
  const sgstAmt = gstOn ? taxable * (state.settings.sgst/100) : 0;
  const total = taxable + cgstAmt + sgstAmt;
  return { subtotal, discountAmt, cgstAmt, sgstAmt, total };
}

/* ---------- ESC/POS building ---------- */
function esc(bytes) { return new Uint8Array(bytes); }
function textToBytes(str) {
  return Array.from(new TextEncoder().encode(str));
}
function padLine(left, right, width) {
  left = left || ''; right = right || '';
  const space = Math.max(1, width - left.length - right.length);
  if (left.length + right.length >= width) {
    left = left.slice(0, Math.max(0, width - right.length - 1));
  }
  return left + ' '.repeat(width - left.length - right.length) + right;
}
function centerLine(str, width) {
  if (str.length >= width) return str.slice(0, width);
  const pad = Math.floor((width - str.length) / 2);
  return ' '.repeat(pad) + str;
}
function wrapText(str, width) {
  const words = str.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > width) { lines.push(cur.trim()); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push(cur);
  return lines;
}

function buildKOTBytes(order) {
  const w = state.settings.paperWidth;
  const bytes = [];
  const push = arr => arr.forEach(b => bytes.push(b));
  push([0x1B, 0x40]); // init
  push([0x1B, 0x61, 0x01]); // center
  push([0x1D, 0x21, 0x11]); // double size
  push(textToBytes('KOT\n'));
  push([0x1D, 0x21, 0x00]); // normal size
  push(textToBytes(centerLine('TAKEAWAY', w) + '\n'));
  push([0x1B, 0x61, 0x00]); // left
  push(textToBytes('-'.repeat(w) + '\n'));
  push(textToBytes(padLine('Order #' + order.orderNo, order.time, w) + '\n'));
  push(textToBytes('-'.repeat(w) + '\n'));
  order.items.forEach(it => {
    const lines = wrapText(it.name, w - 5);
    lines.forEach((ln, idx) => {
      if (idx === 0) push(textToBytes(padLine(ln, '', w - 5) + '  x' + it.qty + '\n'));
      else push(textToBytes(ln + '\n'));
    });
  });
  push(textToBytes('-'.repeat(w) + '\n'));
  push(textToBytes('\n\n\n'));
  return bytes;
}

function buildBillBytes(order, totals) {
  const w = state.settings.paperWidth;
  const bytes = [];
  const push = arr => arr.forEach(b => bytes.push(b));
  const brandName = order.brand === 'Aricee' ? state.settings.aricee_name : state.settings.chilane_name;
  push([0x1B, 0x40]);
  push([0x1B, 0x61, 0x01]);
  push([0x1B, 0x45, 0x01]);
  wrapText(brandName, w).forEach(ln => push(textToBytes(ln + '\n')));
  push([0x1B, 0x45, 0x00]);
  push(textToBytes('Takeaway Bill\n'));
  if (state.settings.gstEnabled && state.settings.gstin) push(textToBytes('GSTIN: ' + state.settings.gstin + '\n'));
  push([0x1B, 0x61, 0x00]);
  push(textToBytes('-'.repeat(w) + '\n'));
  push(textToBytes(padLine('Bill #' + order.orderNo, order.time, w) + '\n'));
  push(textToBytes(order.date + '\n'));
  push(textToBytes('-'.repeat(w) + '\n'));
  order.items.forEach(it => {
    const lineTotal = (it.price * it.qty).toFixed(2);
    const label = it.name + ' x' + it.qty;
    const lines = wrapText(label, w - (lineTotal.length + 1));
    lines.forEach((ln, idx) => {
      if (idx === lines.length - 1) push(textToBytes(padLine(ln, 'Rs.' + lineTotal, w) + '\n'));
      else push(textToBytes(ln + '\n'));
    });
  });
  push(textToBytes('-'.repeat(w) + '\n'));
  push(textToBytes(padLine('Subtotal', 'Rs.' + totals.subtotal.toFixed(2), w) + '\n'));
  if (totals.discountAmt > 0) {
    push(textToBytes(padLine('Discount', '-Rs.' + totals.discountAmt.toFixed(2), w) + '\n'));
  }
  if (state.settings.gstEnabled) {
    push(textToBytes(padLine('CGST ' + state.settings.cgst + '%', 'Rs.' + totals.cgstAmt.toFixed(2), w) + '\n'));
    push(textToBytes(padLine('SGST ' + state.settings.sgst + '%', 'Rs.' + totals.sgstAmt.toFixed(2), w) + '\n'));
  }
  push(textToBytes('-'.repeat(w) + '\n'));
  push([0x1D, 0x21, 0x01]);
  push(textToBytes(padLine('TOTAL', 'Rs.' + totals.total.toFixed(2), Math.floor(w*0.85)) + '\n'));
  push([0x1D, 0x21, 0x00]);
  push(textToBytes('-'.repeat(w) + '\n'));
  push([0x1B, 0x61, 0x01]);
  push(textToBytes('Traditionally Nutritious!\n\n\n'));
  return bytes;
}

/* ---------- printing: RawBT bridge ---------- */
function bytesToBase64(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function printViaRawBT(bytes) {
  const b64 = bytesToBase64(bytes);
  const url = 'intent:base64,' + b64 + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
}

/* ---------- printing: Web Bluetooth (BLE) ---------- */
const BLE_CANDIDATE_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
];
async function connectBLE() {
  if (!navigator.bluetooth) { toast('This browser does not support Bluetooth printing. Try RawBT instead.'); return; }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: BLE_CANDIDATE_SERVICES
    });
    const server = await device.gatt.connect();
    let foundChar = null;
    const services = await server.getPrimaryServices();
    for (const svc of services) {
      const chars = await svc.getCharacteristics();
      const writable = chars.find(c => c.properties.writeWithoutResponse || c.properties.write);
      if (writable) { foundChar = writable; break; }
    }
    if (!foundChar) { toast('Connected, but no printable service found. Try RawBT instead.'); return; }
    state.bleDevice = device;
    state.bleChar = foundChar;
    state.settings.bleDeviceName = device.name || 'Printer';
    persist();
    toast('Connected to ' + state.settings.bleDeviceName);
    render();
  } catch (e) {
    toast('Bluetooth connection cancelled or failed.');
  }
}
async function printViaBLE(bytes) {
  if (!state.bleChar) { toast('No printer connected.'); return false; }
  try {
    const chunkSize = 20;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      const chunk = new Uint8Array(bytes.slice(i, i + chunkSize));
      if (state.bleChar.properties.writeWithoutResponse) await state.bleChar.writeValueWithoutResponse(chunk);
      else await state.bleChar.writeValue(chunk);
      await new Promise(r => setTimeout(r, 20));
    }
    return true;
  } catch (e) {
    toast('Print failed: ' + e.message);
    return false;
  }
}

async function doPrint(bytes) {
  if (state.bleChar) {
    const ok = await printViaBLE(bytes);
    if (ok) { toast('Sent to printer.'); return; }
  }
  printViaRawBT(bytes);
}

/* ---------- order actions ---------- */
function sendKOT() {
  if (state.cart.length === 0) { toast('Cart is empty.'); return; }
  if (!state.currentOrderNo) state.currentOrderNo = nextOrderNo();
  const order = {
    orderNo: state.currentOrderNo,
    brand: state.brand,
    time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
    items: state.cart.map(c => ({ name: c.name + (c.happyHour ? ' (Happy Hour -50%)' : ''), qty: c.qty, price: c.price }))
  };
  doPrint(buildKOTBytes(order));
  persist();
}
function printBillAndCheckout() {
  if (state.cart.length === 0) { toast('Cart is empty.'); return; }
  if (!state.currentOrderNo) state.currentOrderNo = nextOrderNo();
  const totals = cartTotals();
  const now = new Date();
  const order = {
    orderNo: state.currentOrderNo,
    brand: state.brand,
    date: now.toLocaleDateString('en-IN'),
    time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
    items: state.cart.map(c => ({ name: c.name + (c.happyHour ? ' (Happy Hour -50%)' : ''), qty: c.qty, price: c.price })),
    ...totals
  };
  doPrint(buildBillBytes(order, totals));
  state.orders.unshift(order);
  if (state.currentSupabaseOrderId) {
    supa.from('orders').update({ status: 'billed' }).eq('id', state.currentSupabaseOrderId);
  }
  state.cart = [];
  state.currentOrderNo = null;
  state.currentSupabaseOrderId = null;
  state.discount = { type: 'flat', value: 0 };
  persist();
  render();
  toast('Bill printed & saved to history.');
}

/* ---------- menu editing ---------- */
function addMenuItem(category) {
  const name = prompt('Item name:');
  if (!name) return;
  const price = parseFloat(prompt('Price (Rs.):', '0')) || 0;
  const id = 'm' + Date.now();
  state.menu.push({ id, category, name, price });
  persist();
  render();
  supa.from('menu_items').insert({ id, category, name, price, sort_order: state.menu.length });
}
function editMenuPrice(id, val) {
  const item = state.menu.find(m => m.id === id);
  if (item) {
    item.price = parseFloat(val) || 0;
    persist();
    supa.from('menu_items').update({ price: item.price }).eq('id', id);
  }
}
function renameMenuItem(id) {
  const item = state.menu.find(m => m.id === id);
  if (!item) return;
  const name = prompt('Rename item:', item.name);
  if (name) {
    item.name = name; persist(); render();
    supa.from('menu_items').update({ name }).eq('id', id);
  }
}
function deleteMenuItem(id) {
  if (!confirm('Remove this item?')) return;
  state.menu = state.menu.filter(m => m.id !== id);
  persist();
  render();
  supa.from('menu_items').delete().eq('id', id);
}
function addCategory() {
  const cat = prompt('New category name:');
  if (!cat) return;
  addMenuItem(cat);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

      toast('Student discount cannot be applied: all items are on the Happy Hour offer.', 3800);
      return;
    }
    setDiscount('percent', 15, true);
    if (hhItems.length > 0) toast('Student 15% applied only to non-Happy Hour items. Cannot be combined with the Happy Hour offer.', 4200);
  };
  const clearBtn = document.getElementById('clear-cart');
  if (clearBtn) clearBtn.onclick = clearCart;
  const cancelOnlineBtn = document.getElementById('cancel-online-order');
  if (cancelOnlineBtn) cancelOnlineBtn.onclick = cancelCurrentOnlineOrder;
  const kotBtn = document.getElementById('send-kot');
  if (kotBtn) kotBtn.onclick = sendKOT;
  const billBtn = document.getElementById('print-bill');

  document.querySelectorAll('[data-price]').forEach(inp => {

  document.querySelectorAll('[data-rename]').forEach(el => {

  document.querySelectorAll('[data-delete]').forEach(el => {

  document.querySelectorAll('[data-addto]').forEach(el => {

  const addCat = document.getElementById('add-category');
  if (addCat) addCat.onclick = addCategory;

  document.querySelectorAll('[data-oqty]').forEach(el => {
    el.onclick = () => {
      const [orderId, idx, delta] = el.dataset.oqty.split(':');
      changeOnlineItemQty(orderId, parseInt(idx), parseInt(delta));
    };
  });
  document.querySelectorAll('[data-cancel-online]').forEach(el => {
    el.onclick = () => cancelOnlineOrder(el.dataset.cancelOnline);
  });
  document.querySelectorAll('[data-accept]').forEach(el => {
    el.onclick = () => {
      const order = state.onlineOrders.find(o => o.id === el.dataset.accept);
      if (order) acceptOnlineOrder(order);
    };
  });
  document.querySelectorAll('[data-reprint]').forEach(el => {
    el.onclick = () => {
      const key = el.dataset.reprint;
      const order = state.orders.find(o => (o.orderNo+'-'+o.date+'-'+o.time) === key);
      if (order) doPrint(buildBillBytes(order, order));

  const connectBtn = document.getElementById('connect-ble');
  if (connectBtn) connectBtn.onclick = connectBLE;
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) logoutBtn.onclick = doLogout;

    state.settings.aricee_name = document.getElementById('s-aricee').value;
    state.settings.chilane_name = document.getElementById('s-chilane').value;
    state.settings.gstin = document.getElementById('s-gstin').value;
    state.settings.gstEnabled = document.getElementById('s-gst-enabled').checked;

    const sgstEl = document.getElementById('s-sgst');
    if (cgstEl) state.settings.cgst = parseFloat(cgstEl.value) || 0;
    if (sgstEl) state.settings.sgst = parseFloat(sgstEl.value) || 0;

    render();
    toast('Settings saved.');
  };
  const gstToggle = document.getElementById('s-gst-enabled');
  if (gstToggle) gstToggle.onchange = () => { state.settings.gstEnabled = gstToggle.checked; persist(); render(); };
}

/* ---------- auth ---------- */
async function initAuth() {
  const { data } = await supa.auth.getSession();
  state.session = data.session;
  state.authLoading = false;
  if (state.session) {
    await loadMenuFromSupabase();
    subscribeOnlineOrders();
  }
  render();
  supa.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    render();
    if (session) { loadMenuFromSupabase(); subscribeOnlineOrders(); }
  });
}
async function doLogin(email, password) {
  state.authError = '';
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if (error) { state.authError = error.message; render(); }
}
async function doLogout() {
  await supa.auth.signOut();
  state.session = null;
  render();
}

/* ---------- menu sync with Supabase ---------- */
async function loadMenuFromSupabase() {
  const { data, error } = await supa.from('menu_items').select('*').order('sort_order', { ascending: true });
  if (error || !data) return;
  state.menu = data.map(d => ({ id: d.id, category: d.category, name: d.name, price: Number(d.price) }));
  persist();
  render();
}

/* ---------- notification sound ---------- */
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

function playNewOrderSound() {
  if (state.settings.soundEnabled === false) return;
  if (!audioCtx) return;
  const ctx = audioCtx;
  const now = ctx.currentTime;
  function note(freq, start, dur, gainPeak) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'triangle';
    gain.gain.setValueAtTime(0.0001, now + start);
    gain.gain.linearRampToValueAtTime(gainPeak, now + start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now + start);
    osc.stop(now + start + dur + 0.02);
  }
  // soft ascending chime: C5, E5, G5
  note(523.25, 0, 0.5, 0.28);
  note(659.25, 0.11, 0.5, 0.26);
  note(783.99, 0.22, 0.65, 0.24);
}

/* ---------- live incoming orders ---------- */
function subscribeOnlineOrders() {
  refreshOnlineOrders();
  supa.channel('staff-orders')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
      refreshOnlineOrders();
    })
    .subscribe();
}
async function refreshOnlineOrders() {
  const { data, error } = await supa.from('orders').select('*').eq('status', 'pending').order('created_at', { ascending: true });
  if (error) return;
  const fresh = data || [];
  if (state.knownOrderIds === null) {
    // first load after login: don't sound off for orders that were already pending
    state.knownOrderIds = new Set(fresh.map(o => o.id));
  } else {
    const isNew = fresh.some(o => !state.knownOrderIds.has(o.id));
    if (isNew) playNewOrderSound();
    state.knownOrderIds = new Set(fresh.map(o => o.id));
  }
  state.onlineOrders = fresh;
  render();
}
async function acceptOnlineOrder(order) {
  const items = state.onlineOrderEdits[order.id] || order.items;
  if (items.length === 0) return;
  state.brand = order.brand;
  const HH_TAG = ' (Happy Hour -50%)';
  state.cart = items.map(it => {
    const hh = String(it.name).includes(HH_TAG);
    return { itemId: 'online-' + Math.random(), name: hh ? it.name.replace(HH_TAG, '') : it.name, price: it.price, happyHour: hh, qty: it.qty };
  });
  state.currentOrderNo = order.order_no;
  state.currentSupabaseOrderId = order.id;
  state.discount = { type: 'flat', value: 0 };
  state.tab = 'order';
  persist();
  const kotOrder = {
    orderNo: order.order_no,
    time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }),
    items
  };
  doPrint(buildKOTBytes(kotOrder));
  const newTotal = items.reduce((s, it) => s + it.price * it.qty, 0);
  await supa.from('orders').update({ status: 'accepted', items, subtotal: newTotal, total: newTotal }).eq('id', order.id);
  delete state.onlineOrderEdits[order.id];
  render();
}

function changeOnlineItemQty(orderId, idx, delta) {
  const order = state.onlineOrders.find(o => o.id === orderId);
  if (!order) return;
  const items = (state.onlineOrderEdits[orderId] || order.items.map(it => ({ ...it }))).slice();
  items[idx] = { ...items[idx], qty: items[idx].qty + delta };
  const filtered = items.filter(it => it.qty > 0);
  state.onlineOrderEdits[orderId] = filtered;
  render();
}

async function cancelOnlineOrder(orderId) {
  if (!confirm('Cancel this order? The customer will see it as cancelled.')) return;
  await supa.from('orders').update({ status: 'cancelled' }).eq('id', orderId);
  delete state.onlineOrderEdits[orderId];
}

async function cancelCurrentOnlineOrder() {
  if (!state.currentSupabaseOrderId) return;
  if (!confirm('Cancel this order? The customer will see it as cancelled.')) return;
  await supa.from('orders').update({ status: 'cancelled' }).eq('id', state.currentSupabaseOrderId);
  clearCart();
}

initAuth();
</script>
